<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 190" width="480" height="190" role="img" aria-label="Projeto Pixelforge">
<defs>
  <clipPath id="c"><rect x="1" y="1" width="478" height="188"/></clipPath>
  <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#2F6BFF" opacity=".28"/></pattern>
  <pattern id="hz" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="14" height="28" fill="#2F6BFF"/></pattern>
  <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <style>
    .ti{font:400 26px Impact,Haettenschweiler,'Arial Narrow Bold','Arial Black',sans-serif;letter-spacing:1.5px;fill:#fff}
    .ct{font:500 11px 'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace;fill:#6FA0FF;letter-spacing:1.5px}
    .ds{font:400 14px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#a3a9b8}
    .tg{font:600 12px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#f0f0f0}
    .cta{font:400 14px Impact,Haettenschweiler,'Arial Narrow Bold','Arial Black',sans-serif;letter-spacing:2px;fill:#fff}
    .in{font:400 32px Impact,Haettenschweiler,'Arial Narrow Bold','Arial Black',sans-serif;fill:#0a0a0a}
    .sh{animation:sh 7s ease-in-out infinite;animation-delay:0.0s}
    @keyframes sh{0%{transform:translateX(-260px)}45%,100%{transform:translateX(560px)}}
  </style>
</defs>
<rect x="1" y="1" width="478" height="188" fill="#0a0a0a" stroke="#2F6BFF" stroke-width="2"/>
<g clip-path="url(#c)">
  <rect width="480" height="190" fill="url(#dots)"/>
  <rect width="480" height="8" fill="url(#hz)"/>
  <rect class="sh" x="0" y="0" width="240" height="190" fill="url(#sh)" transform="skewX(-18)"/>
</g>
<rect x="28" y="28" width="46" height="46" fill="#2F6BFF"/>
<text class="in" x="51" y="63" text-anchor="middle">P</text>
<text class="ti" x="90" y="52">PIXELFORGE</text>
<text class="ct" x="90" y="70">WEB APP · PIXEL ART</text>
<text class="ds" x="28" y="106">Editor de pixel art no navegador, com camadas,</text>
<text class="ds" x="28" y="126">paletas customizáveis e export de sprite sheet.</text>
<rect x="28" y="146" width="95" height="26" fill="none" stroke="#2F6BFF" stroke-width="1.5"/><text class="tg" x="76" y="163" text-anchor="middle">TypeScript</text>
<rect x="131" y="146" width="60" height="26" fill="none" stroke="#2F6BFF" stroke-width="1.5"/><text class="tg" x="161" y="163" text-anchor="middle">React</text>
<rect x="199" y="146" width="67" height="26" fill="none" stroke="#2F6BFF" stroke-width="1.5"/><text class="tg" x="232" y="163" text-anchor="middle">Canvas</text>
<text class="cta" x="452" y="164" text-anchor="end">VER PROJETO →</text>
<rect x="340" y="169" width="112" height="2" fill="#2F6BFF"/>
</svg>