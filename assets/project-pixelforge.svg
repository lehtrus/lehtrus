<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 190" width="480" height="190" role="img" aria-label="Projeto PixelForge">
<defs>
  <clipPath id="c"><rect x="1" y="1" width="478" height="188" rx="16"/></clipPath>
  <radialGradient id="gl" cx="1" cy="0" r="1"><stop offset="0" stop-color="#7AA2F7" stop-opacity=".28"/><stop offset="1" stop-color="#7AA2F7" stop-opacity="0"/></radialGradient>
  <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <style>
    .ti{font:700 22px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#f0f6fc}
    .ct{font:500 12px 'Segoe UI',Arial,sans-serif;fill:#8b949e;letter-spacing:1px}
    .ds{font:400 14px 'Segoe UI',Arial,sans-serif;fill:#b1bac4}
    .tg{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#e6edf3}
    .cta{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#7AA2F7}
    .in{font:800 22px 'Segoe UI',Arial,sans-serif;fill:#7AA2F7}
    .sh{animation:sh 7s ease-in-out infinite;animation-delay:0.0s}
    @keyframes sh{0%{transform:translateX(-260px)}45%,100%{transform:translateX(560px)}}
  </style>
</defs>
<rect x="1" y="1" width="478" height="188" rx="16" fill="#161b22" stroke="#30363d" stroke-width="2"/>
<g clip-path="url(#c)">
  <circle cx="480" cy="0" r="230" fill="url(#gl)"/>
  <rect x="0" y="0" width="480" height="4" fill="#7AA2F7"/>
  <rect class="sh" x="0" y="0" width="240" height="190" fill="url(#sh)" transform="skewX(-18)"/>
</g>
<rect x="28" y="26" width="46" height="46" rx="12" fill="#7AA2F7" fill-opacity=".14" stroke="#7AA2F7" stroke-opacity=".55"/>
<text class="in" x="51" y="57" text-anchor="middle">P</text>
<text class="ti" x="90" y="47">PixelForge</text>
<text class="ct" x="90" y="66">WEB APP · PIXEL ART</text>
<text class="ds" x="28" y="104">Editor de pixel art no navegador, com camadas,</text>
<text class="ds" x="28" y="124">paletas customizáveis e export de sprite sheet.</text>
<rect x="28" y="146" width="93" height="26" rx="13" fill="#7AA2F7" fill-opacity=".12" stroke="#7AA2F7" stroke-opacity=".45"/><text class="tg" x="74" y="163" text-anchor="middle">TypeScript</text>
<rect x="129" y="146" width="58" height="26" rx="13" fill="#7AA2F7" fill-opacity=".12" stroke="#7AA2F7" stroke-opacity=".45"/><text class="tg" x="158" y="163" text-anchor="middle">React</text>
<rect x="196" y="146" width="65" height="26" rx="13" fill="#7AA2F7" fill-opacity=".12" stroke="#7AA2F7" stroke-opacity=".45"/><text class="tg" x="228" y="163" text-anchor="middle">Canvas</text>
<text class="cta" x="452" y="163" text-anchor="end">ver projeto →</text>
</svg>