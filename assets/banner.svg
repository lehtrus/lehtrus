<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Leticia, Developer e Graphic Designer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f0c29"/><stop offset=".55" stop-color="#302b63"/><stop offset="1" stop-color="#1a1b3a"/></linearGradient>
  <linearGradient id="txt" gradientUnits="userSpaceOnUse" x1="340" y1="0" x2="860" y2="0"><stop offset="0" stop-color="#7AA2F7"/><stop offset=".5" stop-color="#BB9AF7"/><stop offset="1" stop-color="#F7768E"/></linearGradient>
  <linearGradient id="wv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7AA2F7"/><stop offset="1" stop-color="#BB9AF7"/></linearGradient>
  <radialGradient id="g1"><stop offset="0" stop-color="#7AA2F7" stop-opacity=".45"/><stop offset="1" stop-color="#7AA2F7" stop-opacity="0"/></radialGradient>
  <radialGradient id="g2"><stop offset="0" stop-color="#F7768E" stop-opacity=".35"/><stop offset="1" stop-color="#F7768E" stop-opacity="0"/></radialGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#fff" opacity=".09"/></pattern>
  <filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="r"><rect width="1200" height="340" rx="28"/></clipPath>
  <style>
    .orb{animation:float 7s ease-in-out infinite alternate}
    .o2{animation-duration:9s;animation-delay:-3s} .o3{animation-duration:6s;animation-delay:-1s}
    @keyframes float{from{transform:translateY(-12px)}to{transform:translateY(14px)}}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
    .role{font:600 21px 'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace;fill:#7AA2F7;animation:fade 9s infinite both}
    @keyframes fade{0%{opacity:0;transform:translateY(8px)}5%{opacity:1;transform:none}28%{opacity:1;transform:none}33%,100%{opacity:0;transform:translateY(-8px)}}
    .w1{animation:slide 16s linear infinite} .w2{animation:slide 26s linear infinite reverse}
    @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-600px)}}
    .name{font:800 100px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:14px}
    .sub{font:500 21px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:9px;fill:#c0caf5}
    .tag{font:600 12px 'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#c0caf5}
  </style>
</defs>
<g clip-path="url(#r)">
  <rect width="1200" height="340" fill="url(#bg)"/>
  <circle cx="180" cy="70" r="260" fill="url(#g1)"/>
  <circle cx="1040" cy="270" r="300" fill="url(#g2)"/>
  <rect width="1200" height="340" fill="url(#dots)"/>
  <g class="orb"><circle cx="110" cy="240" r="9" fill="#7AA2F7" opacity=".7" filter="url(#glow)"/></g>
  <g class="orb o2"><circle cx="1090" cy="90" r="12" fill="#BB9AF7" opacity=".7" filter="url(#glow)"/></g>
  <g class="orb o3"><circle cx="250" cy="115" r="5" fill="#F7768E" opacity=".8" filter="url(#glow)"/></g>
  <g class="orb o2"><circle cx="960" cy="200" r="6" fill="#9ECE6A" opacity=".7" filter="url(#glow)"/></g>
  <g class="orb"><circle cx="720" cy="70" r="4" fill="#7DCFFF" opacity=".8" filter="url(#glow)"/></g>
  <rect x="52" y="34" width="232" height="30" rx="15" fill="#9ECE6A" fill-opacity=".12" stroke="#9ECE6A" stroke-opacity=".45"/>
  <circle class="pulse" cx="73" cy="49" r="4.5" fill="#9ECE6A"/>
  <text class="tag" x="88" y="53">OPEN TO COLLABORATE</text>
  <text class="name" x="600" y="172" text-anchor="middle" fill="url(#txt)" filter="url(#glow)">LETICIA</text>
  <text class="sub" x="600" y="216" text-anchor="middle">DEVELOPER · GRAPHIC DESIGNER</text>
  <text class="role" x="600" y="268" text-anchor="middle" style="opacity:1;animation-delay:0s">&gt; C#  ·  .NET  ·  APIs limpas e testadas</text>
<text class="role" x="600" y="268" text-anchor="middle" style="opacity:0;animation-delay:3s">&gt; TypeScript  ·  React  ·  Interfaces que encantam</text>
<text class="role" x="600" y="268" text-anchor="middle" style="opacity:0;animation-delay:6s">&gt; Design gráfico  ·  Identidade visual  ·  Figma</text>

