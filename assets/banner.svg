<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Leticia, Developer e Graphic Designer">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#2F6BFF" opacity=".3"/></pattern>
  <pattern id="hz" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="14" height="28" fill="#2F6BFF"/></pattern>
  <style>
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
    .role{font:600 21px 'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace;fill:#6FA0FF;animation:fade 9s infinite both}
    @keyframes fade{0%{opacity:0;transform:translateY(8px)}5%{opacity:1;transform:none}28%{opacity:1;transform:none}33%,100%{opacity:0;transform:translateY(-8px)}}
    .tapeg{animation:slide 14s linear infinite}
    @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-800px)}}
    .name{font:400 150px Impact,Haettenschweiler,'Arial Narrow Bold','Arial Black',sans-serif;letter-spacing:12px}
    .tag{font:600 12px 'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace;letter-spacing:2px;fill:#fff}
    .tp{font:400 24px Impact,Haettenschweiler,'Arial Narrow Bold','Arial Black',sans-serif;letter-spacing:5px;fill:#0a0a0a}
    .st{font:400 16px Impact,Haettenschweiler,'Arial Narrow Bold','Arial Black',sans-serif;letter-spacing:1px;fill:#2F6BFF}
  </style>
</defs>
<rect width="1200" height="340" fill="#0a0a0a"/>
<rect width="1200" height="340" fill="url(#dots)"/>
<rect width="1200" height="12" fill="url(#hz)"/>
<rect x="40" y="34" width="290" height="34" fill="none" stroke="#2F6BFF" stroke-width="2"/>
<rect x="40" y="34" width="34" height="34" fill="#2F6BFF"/>
<circle class="pulse" cx="57" cy="51" r="5" fill="#0a0a0a"/>
<text class="tag" x="88" y="56">OPEN TO COLLABORATE</text>
<g transform="rotate(-12 1080 130)">
  <circle cx="1080" cy="130" r="56" fill="none" stroke="#2F6BFF" stroke-width="3" stroke-dasharray="7 4"/>
  <circle cx="1080" cy="130" r="45" fill="none" stroke="#2F6BFF" stroke-width="1"/>
  <text class="st" x="1080" y="126" text-anchor="middle">DEV</text>
  <text class="st" x="1080" y="146" text-anchor="middle">+DESIGN</text>
</g>
<text class="name" x="607" y="187" text-anchor="middle" fill="#2F6BFF">LETICIA</text>
<text class="name" x="600" y="180" text-anchor="middle" fill="#fff">LETICIA</text>
<text class="role" x="600" y="238" text-anchor="middle" style="opacity:1;animation-delay:0s">&gt; C#  ·  .NET  ·  APIs limpas e testadas</text>
<text class="role" x="600" y="238" text-anchor="middle" style="opacity:0;animation-delay:3s">&gt; TypeScript  ·  React  ·  Interfaces que encantam</text>
<text class="role" x="600" y="238" text-anchor="middle" style="opacity:0;animation-delay:6s">&gt; Design gráfico  ·  Identidade visual  ·  Figma</text>
<rect y="296" width="1200" height="44" fill="#2F6BFF"/>
<g class="tapeg"><text class="tp" x="0" y="326" textLength="800" lengthAdjust="spacing" xml:space="preserve">DEVELOPER  ×  GRAPHIC DESIGNER  ×  </text><text class="tp" x="800" y="326" textLength="800" lengthAdjust="spacing" xml:space="preserve">DEVELOPER  ×  GRAPHIC DESIGNER  ×  </text><text class="tp" x="1600" y="326" textLength="800" lengthAdjust="spacing" xml:space="preserve">DEVELOPER  ×  GRAPHIC DESIGNER  ×  </text></g>
<rect x="1" y="1" width="1198" height="338" fill="none" stroke="#2F6BFF" stroke-width="2"/>
</svg>