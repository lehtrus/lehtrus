  <text class="fn" x="280" y="28" text-anchor="middle">leticia.ts</text>
  <text class="ln" xml:space="preserve" x="34" y="86" style="animation-delay:0.30s"><tspan fill="#BB9AF7">const </tspan><tspan fill="#7DCFFF">leticia </tspan><tspan fill="#89ddff">= {</tspan></text>
<text class="ln" xml:space="preserve" x="54" y="115" style="animation-delay:0.52s"><tspan fill="#73daca">role</tspan><tspan fill="#89ddff">: </tspan><tspan fill="#9ECE6A">&quot;Developer &amp; Designer&quot;</tspan><tspan fill="#89ddff">,</tspan></text>
<text class="ln" xml:space="preserve" x="54" y="144" style="animation-delay:0.74s"><tspan fill="#73daca">languages</tspan><tspan fill="#89ddff">: [</tspan><tspan fill="#9ECE6A">&quot;C#&quot;</tspan><tspan fill="#89ddff">, </tspan><tspan fill="#9ECE6A">&quot;TypeScript&quot;</tspan><tspan fill="#89ddff">],</tspan></text>
<text class="ln" xml:space="preserve" x="54" y="173" style="animation-delay:0.96s"><tspan fill="#73daca">frameworks</tspan><tspan fill="#89ddff">: [</tspan><tspan fill="#9ECE6A">&quot;.NET&quot;</tspan><tspan fill="#89ddff">, </tspan><tspan fill="#9ECE6A">&quot;React&quot;</tspan><tspan fill="#89ddff">, </tspan><tspan fill="#9ECE6A">&quot;Next.js&quot;</tspan><tspan fill="#89ddff">],</tspan></text>
<text class="ln" xml:space="preserve" x="54" y="202" style="animation-delay:1.18s"><tspan fill="#73daca">design</tspan><tspan fill="#89ddff">: [</tspan><tspan fill="#9ECE6A">&quot;Figma&quot;</tspan><tspan fill="#89ddff">, </tspan><tspan fill="#9ECE6A">&quot;Illustrator&quot;</tspan><tspan fill="#89ddff">],</tspan></text>
<text class="ln" xml:space="preserve" x="54" y="231" style="animation-delay:1.40s"><tspan fill="#73daca">creative</tspan><tspan fill="#89ddff">: [</tspan><tspan fill="#9ECE6A">&quot;Unity&quot;</tspan><tspan fill="#89ddff">, </tspan><tspan fill="#9ECE6A">&quot;Blender&quot;</tspan><tspan fill="#89ddff">],</tspan></text>
<text class="ln" xml:space="preserve" x="54" y="260" style="animation-delay:1.62s"><tspan fill="#73daca">coffeeLevel</tspan><tspan fill="#89ddff">: </tspan><tspan fill="#9ECE6A">&quot;critical&quot;</tspan><tspan fill="#89ddff">,</tspan></text>
