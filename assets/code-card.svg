  </style>
</defs>
<rect x="1" y="1" width="558" height="433" rx="0" fill="#0a0a0a" stroke="url(#bd)" stroke-opacity="1" stroke-width="2"/>
<g clip-path="url(#c)">
  <rect x="1" y="1" width="558" height="44" fill="#111111"/>
  <rect x="22" y="17" width="12" height="12" fill="#2F6BFF"/><rect x="44" y="17" width="12" height="12" fill="none" stroke="#2F6BFF" stroke-width="2"/><rect x="66" y="17" width="12" height="12" fill="#fff"/>
  <text class="fn" x="280" y="28" text-anchor="middle">leticia.ts</text>
  <text class="ln" xml:space="preserve" x="34" y="86" style="animation-delay:0.30s"><tspan fill="#2F6BFF">const </tspan><tspan fill="#8DB6FF">leticia </tspan><tspan fill="#5b6273">= {</tspan></text>
<text class="ln" xml:space="preserve" x="54" y="115" style="animation-delay:0.52s"><tspan fill="#6FA0FF">role</tspan><tspan fill="#5b6273">: </tspan><tspan fill="#ffffff">&quot;Developer &amp; Designer&quot;</tspan><tspan fill="#5b6273">,</tspan></text>
<text class="ln" xml:space="preserve" x="54" y="144" style="animation-delay:0.74s"><tspan fill="#6FA0FF">languages</tspan><tspan fill="#5b6273">: [</tspan><tspan fill="#ffffff">&quot;C#&quot;</tspan><tspan fill="#5b6273">, </tspan><tspan fill="#ffffff">&quot;TypeScript&quot;</tspan><tspan fill="#5b6273">],</tspan></text>
<text class="ln" xml:space="preserve" x="54" y="173" style="animation-delay:0.96s"><tspan fill="#6FA0FF">frameworks</tspan><tspan fill="#5b6273">: [</tspan><tspan fill="#ffffff">&quot;.NET&quot;</tspan><tspan fill="#5b6273">, </tspan><tspan fill="#ffffff">&quot;React&quot;</tspan><tspan fill="#5b6273">, </tspan><tspan fill="#ffffff">&quot;Next.js&quot;</tspan><tspan fill="#5b6273">],</tspan></text>
<text class="ln" xml:space="preserve" x="54" y="202" style="animation-delay:1.18s"><tspan fill="#6FA0FF">design</tspan><tspan fill="#5b6273">: [</tspan><tspan fill="#ffffff">&quot;Figma&quot;</tspan><tspan fill="#5b6273">, </tspan><tspan fill="#ffffff">&quot;Illustrator&quot;</tspan><tspan fill="#5b6273">],</tspan></text>
<text class="ln" xml:space="preserve" x="54" y="231" style="animation-delay:1.40s"><tspan fill="#6FA0FF">creative</tspan><tspan fill="#5b6273">: [</tspan><tspan fill="#ffffff">&quot;Unity&quot;</tspan><tspan fill="#5b6273">, </tspan><tspan fill="#ffffff">&quot;Blender&quot;</tspan><tspan fill="#5b6273">],</tspan></text>
<text class="ln" xml:space="preserve" x="54" y="260" style="animation-delay:1.62s"><tspan fill="#6FA0FF">coffeeLevel</tspan><tspan fill="#5b6273">: </tspan><tspan fill="#ffffff">&quot;critical&quot;</tspan><tspan fill="#5b6273">,</tspan></text>
<text class="ln" xml:space="preserve" x="54" y="289" style="animation-delay:1.84s"><tspan fill="#6FA0FF">openToWork</tspan><tspan fill="#5b6273">: </tspan><tspan fill="#ffffff">true</tspan><tspan fill="#5b6273">,</tspan></text>
<text class="ln" xml:space="preserve" x="34" y="318" style="animation-delay:2.06s"><tspan fill="#5b6273">};</tspan></text>
<text class="ln" xml:space="preserve" x="34" y="376" style="animation-delay:2.50s"><tspan fill="#8DB6FF">leticia</tspan><tspan fill="#5b6273">.</tspan><tspan fill="#2F6BFF">createSomethingCool</tspan><tspan fill="#5b6273">();</tspan></text>

  <rect class="cur" x="34" y="390" width="9" height="18" fill="#2F6BFF"/>
</g>
</svg>