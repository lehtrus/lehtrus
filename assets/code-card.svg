<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 435" width="560" height="435" role="img" aria-label="Cartão de código com o perfil da Leticia">
<defs>
  <linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2F6BFF"/><stop offset="1" stop-color="#2F6BFF"/></linearGradient>
  <clipPath id="c"><rect x="1" y="1" width="558" height="433" rx="0"/></clipPath>
  <style>
    text{font:500 15px 'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace}
    .ln{animation:in .5s ease-out both}
    @keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
    .cur{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
