<text class="ln" xml:space="preserve" x="34" y="318" style="animation-delay:2.06s"><tspan fill="#89ddff">};</tspan></text>
<text class="ln" xml:space="preserve" x="34" y="376" style="animation-delay:2.50s"><tspan fill="#7DCFFF">leticia</tspan><tspan fill="#89ddff">.</tspan><tspan fill="#BB9AF7">createSomethingCool</tspan><tspan fill="#89ddff">();</tspan></text>

  <rect class="cur" x="34" y="390" width="9" height="18" fill="#7AA2F7"/>
