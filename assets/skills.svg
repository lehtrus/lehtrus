    .pc{font:500 13px 'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace;fill:#8a90a0}
    .bar{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.4s cubic-bezier(.2,.8,.2,1) both}
    @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  </style>
</defs>
