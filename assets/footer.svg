<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="Feito com café, código e design">
<defs>
  <pattern id="hz" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="14" height="28" fill="#2F6BFF"/></pattern>
  <style>
    .tapeg{animation:slide 12s linear infinite}
    @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-600px)}}
    .t{font:400 34px Impact,Haettenschweiler,'Arial Narrow Bold','Arial Black',sans-serif;letter-spacing:7px;fill:#fff}
    .s{font:500 12px 'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace;fill:#6FA0FF;letter-spacing:2px}
    .tp{font:400 15px Impact,Haettenschweiler,'Arial Narrow Bold','Arial Black',sans-serif;letter-spacing:4px;fill:#0a0a0a}
  </style>
</defs>
<rect width="1200" height="120" fill="#0a0a0a"/>
<rect width="1200" height="10" fill="url(#hz)"/>
<text class="t" x="600" y="55" text-anchor="middle">FEITO COM CAFÉ, CÓDIGO E DESIGN</text>
<text class="s" x="600" y="78" text-anchor="middle">// obrigada por passar por aqui</text>
<rect y="92" width="1200" height="28" fill="#2F6BFF"/>
<g class="tapeg"><text class="tp" x="0" y="115" textLength="600" lengthAdjust="spacing" xml:space="preserve">OBRIGADA POR PASSAR POR AQUI  ×  </text><text class="tp" x="600" y="115" textLength="600" lengthAdjust="spacing" xml:space="preserve">OBRIGADA POR PASSAR POR AQUI  ×  </text><text class="tp" x="1200" y="115" textLength="600" lengthAdjust="spacing" xml:space="preserve">OBRIGADA POR PASSAR POR AQUI  ×  </text></g>
<rect x="1" y="1" width="1198" height="118" fill="none" stroke="#2F6BFF" stroke-width="2"/>
</svg>